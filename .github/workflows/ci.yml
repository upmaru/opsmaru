name: CI
# One run per commit: pull requests into the long-lived branches, and pushes
# after merge. Feature branches get CI through their PR.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  embedded:
    # Database-free checks. Web tests need PostgreSQL; run them locally with
    # scripts/check-isolated.py. The Incus adapter is tested in upmaru/opsmaru-incus.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PHX_SERVER: 'true'
      PORT: 'not-a-port'
      MISE_DISABLE_TOOLS: postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.6.11
          install: false
      - run: mise trust && mise install elixir erlang node npm:@fission-ai/openspec
      - run: mise exec -- mix local.hex --force && mise exec -- mix local.rebar --force && mise exec -- mix deps.get
      - run: mise exec -- mix format --check-formatted
      - run: mise exec -- mix compile --warnings-as-errors
      - run: mise exec -- mix credo --strict
      - run: mise exec -- mix run --no-start scripts/check-embedded.exs
      - run: mise run spec:validate
