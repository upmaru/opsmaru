name: Embedded Incus foundation
on:
  push:
    branches: [feature/phoenix-bootstrap-and-remote-access]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  library:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PHX_SERVER: 'true'
      PORT: 'not-a-port'
      MIX_ENV: library
      GOTOOLCHAIN: local
      MISE_DISABLE_TOOLS: postgres # Library/consumer checks never need a database installation.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.6.11
          install: false
      - run: mise trust && mise install elixir erlang node npm:@fission-ai/openspec go
      - run: mise exec -- mix local.hex --force && mise exec -- mix local.rebar --force && mise exec -- mix deps.get
      - run: mise run check:library
      - run: mise run spec:validate
      - run: GO111MODULE=off mise exec -- go test ./scripts ./scripts/incus-model-schema
      - run: python3 scripts/check-incus-constants.py
      - name: Isolated immutable Git consumer
        env:
          # PR github.sha is a synthetic merge commit, absent from normal Git fetches.
          OPSMARU_FIXTURE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          OPSMARU_FIXTURE_REPOSITORY: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
        run: python3 scripts/check-consumer.py
